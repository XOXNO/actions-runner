name: Build and publish runner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/xoxno/actions-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/XOXNO/actions-runner
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke test as runner user
        run: |
          docker run --rm --entrypoint bash "$IMAGE:sha-$GITHUB_SHA" -euc '
            test "$(id -un)" = runner
            test -x /home/runner/run.sh
            for tool in make cc c++ git curl jq pkg-config python3 xxd zstd; do
              command -v "$tool"
            done
            printf "int main(void) { return 0; }\n" | cc -x c - -o /tmp/runner-smoke
            /tmp/runner-smoke
            python3 -m venv /tmp/runner-venv
          '

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
